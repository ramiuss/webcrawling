<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<style>
p:nth-child(1) { color: blue; }   /* 부모 안에서 첫 번째 <p> */
p:nth-child(2) { color: red; }    /* 부모 안에서 두 번째 <p> */
p:nth-child(2n) { color: green; } /* 짝수 번째 <p> */

</style>
<body>
<p> paragraph1</p>
<p> paragraph2</p>
<p> paragraph3 </p>
<p> paragraph4</p>
</body>
</html>
