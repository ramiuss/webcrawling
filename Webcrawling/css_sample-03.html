<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ID Selecter</title>
    <style>
        #kimchi {color:blue }
        .western {color:blue }
    </style>
</head>
<body>
아이디는 #id 클래스는 .class 를 이용하여 표시 한다
    <p class='korean' id='bibimbap'> 비빔밥</p>
    <p class='korean' id='bulgogi'> 불고기</p>
    <p class='korean' id='kimchi'> 김치</p>
    <p class="western" id="steak">스테이크</p>
    <p class="western" id="hamburger">햄버거</p>


</body>
</html>
